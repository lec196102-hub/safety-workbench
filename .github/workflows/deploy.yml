name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许手动触发
  workflow_dispatch:

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      # 使用 build:pages 产出扁平的 dist/（含 index.html + assets + 404.html）
      # 说明：默认的 `npm run build`（scripts/build.sh）面向 miaoda 部署平台，
      # 会拆分产物并用 MIAODA_APP_ID 覆盖 CLIENT_BASE_PATH，不适合 GitHub Pages。
      - name: Build
        run: npm run build:pages
        env:
          # 项目站点 base path = /<repo-name>/，由 build-pages.mjs 读取并传给 vite
          CLIENT_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
